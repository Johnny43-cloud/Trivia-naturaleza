    <script type="py">
import builtins
from js import window

def web_input(prompt_text=""):
    return window.prompt(prompt_text)

def web_print(*args, **kwargs):
    text = " ".join(str(x) for x in args)
    window.alert(text)

builtins.input = web_input
builtins.print = web_print

# Abrimos y ejecutamos tu archivo original de más de 300 líneas
try:
    with open("Trivia-naturaleza.py", "r", encoding="utf-8") as f:
        exec(f.read())
except Exception as e:
    window.alert(f"Error al cargar el examen: {e}")
    </script>
