import window
import builtins

# Enlazamos tus funciones nativas de consola a alertas de la web
def web_input(prompt_text=""):
    return window.prompt(prompt_text)

def web_print(*args, **kwargs):
    text = " ".join(str(x) for x in args)
    window.alert(text)

builtins.input = web_input
builtins.print = web_print

# Ejecutamos tu archivo original de Python

    exec(open("Trivia-naturaleza.py", encoding="utf-8").read())
