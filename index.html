<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Naturaleza 🧠</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.1/core.js"></script>
</head>
<body style="background-color: #121212; color: #ffffff; font-family: sans-serif; padding: 20px; text-align: center;">

    <h2 style="color: #4CAF50;">🌿 BIENVENIDO A MI TRIVIA DE NATURALEZA 🧠</h2>
    <p>Proyecto de Examen - Día 3 Autodidacta</p>
    <p style="color: #888; font-size: 14px;">El juego se abrirá en ventanas flotantes en tu pantalla. ¡Suerte!</p>
    <hr style="border: 1px solid #333; width: 80%;">

    <p id="cargando" style="color: #FFC107;">⏳ Cargando el juego... puede tardar unos segundos la primera vez.</p>

    <script type="py" config='{"files": {"./Trivia-naturaleza.py": "./Trivia-naturaleza.py"}}'>
import builtins
from js import window, document

buffer = []

def web_print(*args, sep=" ", end="\n", **kwargs):
    buffer.append(sep.join(str(a) for a in args) + end)

def web_input(prompt_text=""):
    texto = "".join(buffer) + str(prompt_text)
    buffer.clear()
    respuesta = window.prompt(texto)
    return "" if respuesta is None else str(respuesta)

builtins.print = web_print
builtins.input = web_input

document.getElementById("cargando").style.display = "none"

try:
    with open("Trivia-naturaleza.py", "r", encoding="utf-8") as f:
        codigo = f.read()
    exec(compile(codigo, "Trivia-naturaleza.py", "exec"), {"__name__": "__main__"})
except SystemExit:
    pass  # es el sys.exit() de tu GAME OVER, es normal
except Exception as e:
    window.alert(f"Error en el examen: {e}")
finally:
    if buffer:
        window.alert("".join(buffer))
    </script>

</body>
</html>
